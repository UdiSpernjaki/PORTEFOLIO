<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Pinturas Digitais · Portefólio</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f7f7f7;
      color: #222;
      margin: 0;
      padding: 0;
    }

    /* BOTÃO VOLTAR */
    .voltar {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #fff;
      border: 2px solid #000;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      color: #000;
      z-index: 1000;
    }

    .voltar:hover {
      background: #000;
      color: #fff;
    }

    main {
      padding: 80px 40px 40px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p.intro {
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }

    .obra {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .obra img {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .obra h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .obra p {
      font-size: 15px;
      line-height: 1.6;
    }

    /* MODAL DE EXPANSÃO */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    .fechar, .anterior, .seguinte {
      position: absolute;
      color: #fff;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .fechar {
      top: 20px;
      right: 30px;
    }

    .anterior {
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
    }

    .seguinte {
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
    }

    .fechar:hover, .anterior:hover, .seguinte:hover {
      color: #ccc;
    }
  </style>
</head>
<body>

<a href="pinturas.html" class="voltar">←</a>

<main>
  <h2>Pinturas Digitais</h2>
  <p class="intro">
    Série de obras digitais que exploram composição, atmosfera, narrativa visual e textura pictórica em ambiente digital.
  </p>

  <div class="gallery">
    <div class="obra"><img src="Ilustracao1.jpg" alt="Ilustracao1"></div>
    <div class="obra"><img src="Ilustracao2.jpg" alt="Ilustracao2"></div>
    <div class="obra"><img src="Ilustracao3.jpg" alt="Ilustracao3"></div>
    <div class="obra"><img src="Ilustracao7.jpg" alt="Ilustracao7"></div>
  </div>
</main>

<!-- MODAL -->
<div class="modal" id="modal">
  <span class="fechar" id="fechar">X</span>
  <span class="anterior" id="anterior">‹</span>
  <img id="imagemModal" src="">
  <span class="seguinte" id="seguinte">›</span>
</div>

<script>
  const imagens = document.querySelectorAll('.obra img');
  const modal = document.getElementById('modal');
  const imagemModal = document.getElementById('imagemModal');
  const fechar = document.getElementById('fechar');
  const anterior = document.getElementById('anterior');
  const seguinte = document.getElementById('seguinte');
  let indiceAtual = 0;

  imagens.forEach((img, i) => {
    img.addEventListener('click', () => {
      indiceAtual = i;
      abrirModal();
    });
  });

  function abrirModal() {
    modal.style.display = 'flex';
    imagemModal.src = imagens[indiceAtual].src;
  }

  fechar.addEventListener('click', () => modal.style.display = 'none');
  anterior.addEventListener('click', () => {
    indiceAtual = (indiceAtual - 1 + imagens.length) % imagens.length;
    imagemModal.src = imagens[indiceAtual].src;
  });
  seguinte.addEventListener('click', () => {
    indiceAtual = (indiceAtual + 1) % imagens.length;
    imagemModal.src = imagens[indiceAtual].src;
  });

  modal.addEventListener('click', e => {
    if (e.target === modal) modal.style.display = 'none';
  });
</script>

</body>
</html>
